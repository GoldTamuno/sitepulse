# Runs on every push and pull request. Each job below maps directly to a
# requirement in the project spec's "CI/CD Requirements" section — build,
# unit tests, formatting, linting, static analysis, vulnerability scanning,
# secret scanning, dependency verification. Jobs run in parallel (they're
# independent of each other) so a PR gets full feedback in one CI run
# rather than a slow serial chain, and a pull request is blocked from
# merging if ANY of them fails — that's enforced on GitHub's side via
# branch protection rules referencing these job names, not something this
# YAML file can do by itself (see docs/README.md or the repo's branch
# protection settings for that configuration step).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch/PR if a new commit is
# pushed — avoids burning CI minutes running checks against code that's
# already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  # --- Formatting & static analysis ---
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # gofmt has no "check mode" flag of its own; -l lists files that
      # WOULD be reformatted without changing them, so a non-empty output
      # means the codebase isn't gofmt-clean. Piping through a shell check
      # that fails on any output is the standard way to turn this into a
      # pass/fail CI gate.
      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' locally and commit the result."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint bundles ~15 linters (staticcheck, unused, errcheck,
      # ineffassign, and more) behind one tool and one config file, rather
      # than running each linter as its own separate CI step — the
      # project's spec calls out staticcheck and golangci-lint separately,
      # but golangci-lint runs staticcheck internally, so one step here
      # covers both without duplicating work.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # --- Unit tests ---
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -race enables Go's race detector — given how much of this project
      # is concurrent (worker pool, scheduler, cert-watch cooldown map),
      # this is not optional. It roughly doubles test runtime and memory
      # use, which is a fine trade for catching a data race in CI instead
      # of in production.
      # -cover reports coverage; -coverprofile writes it to a file for the
      # Codecov-style step below rather than only printing a summary.
      - name: Run tests with race detector
        run: go test -race -cover -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  # --- Build ---
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Build Docker image
        run: docker build -f deployments/Dockerfile -t sitepulse:ci .

  # --- Dependency verification ---
  deps:
    name: Dependency Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go mod tidy should be a no-op in a clean repo — if it changes
      # go.mod/go.sum, that means someone imported something without
      # running tidy locally first, or go.sum is out of sync with go.mod.
      # `git diff --exit-code` fails the step if tidy produced any change.
      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify module checksums
        run: go mod verify

  # --- Vulnerability scanning ---
  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # govulncheck cross-references this module's actual call graph
      # against Go's public vulnerability database — it flags a
      # vulnerable dependency ONLY if the vulnerable code path is actually
      # reachable from this codebase, which is meaningfully more precise
      # than "a dependency has a CVE somewhere in it" (the latter produces
      # a lot of noise for code paths a project never calls).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # --- Secret scanning ---
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the latest commit, to catch a secret committed and later removed

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Software Bill of Materials ---
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      # Syft inspects the module graph and produces a standardized SBOM
      # (CycloneDX format here) — a machine-readable inventory of every
      # dependency and its exact version. This is what the project's spec
      # means by "supply chain security": knowing precisely what's in the
      # binary, not just trusting go.sum silently.
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
